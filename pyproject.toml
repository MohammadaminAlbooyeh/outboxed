[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outboxed"
version = "0.1.0"
description = "Transactional outbox pattern for Python backends"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Amin Albooyeh", email = "amin.albooyeh@gmail.com" },
]
keywords = ["outbox", "transactional-outbox", "event-driven", "kafka", "sqs", "redis", "sqlalchemy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.0"]
redis = ["redis>=5.0"]
sqs = ["boto3>=1.34"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/amin-albooyeh/outboxed"
Documentation = "https://github.com/amin-albooyeh/outboxed/tree/main/docs"
Issues = "https://github.com/amin-albooyeh/outboxed/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/outboxed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["outboxed"]

[[tool.mypy.overrides]]
module = [
    "test_dedup",
    "test_outbox_enqueue",
    "test_relay_delivery",
    "test_chaos_crash_recovery",
    "test_kafka",
    "test_in_memory",
    "test_sqs",
    "test_redis_streams",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
